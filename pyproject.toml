[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skinaudit"
version = "0.1.0"
description = "Metadata audit toolkit for skin-lesion image datasets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Mohammad Hossein Omoumi" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn==1.6.1",
  "matplotlib>=3.8",
  "pillow>=10",
  "imagehash==4.3.2",
  "joblib>=1.3",
  "threadpoolctl>=3.1",
]

[project.urls]
Repository = "https://github.com/omoumi/skin-metadata-audit"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["skinaudit*"]
